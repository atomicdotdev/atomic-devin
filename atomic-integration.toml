schema = 1
agent = "devin"
version = "1.0.0"

[requires]
atomic = ">=0.11.0"

[skills-source]
package = "atomic-skills"

[[skill]]
src = "skills/atomic-vault/SKILL.md"
dst = "~/.codeium/windsurf/skills/atomic-vault/SKILL.md"

[[skill]]
src = "skills/atomic-vcs/SKILL.md"
dst = "~/.codeium/windsurf/skills/atomic-vcs/SKILL.md"

[[skill]]
src = "skills/code-intelligence/SKILL.md"
dst = "~/.codeium/windsurf/skills/code-intelligence/SKILL.md"

[[skill]]
src = "skills/intent-builder/SKILL.md"
dst = "~/.codeium/windsurf/skills/intent-builder/SKILL.md"

[[repo-file]]
src = "AGENTS.md"
dst = "AGENTS.md"

# Hook scripts invoked by the windsurf hooks (payload enrichment wrappers
# around `atomic agent hooks devin <verb>`). Executable bit preserved by copy.
[[file]]
src = "hooks/scripts/prompt_submit.sh"
dst = "~/.codeium/windsurf/scripts/prompt_submit.sh"

[[file]]
src = "hooks/scripts/turn_end.sh"
dst = "~/.codeium/windsurf/scripts/turn_end.sh"

[[file]]
src = "hooks/scripts/post_tool.sh"
dst = "~/.codeium/windsurf/scripts/post_tool.sh"

[[file]]
src = "hooks/scripts/session_end.sh"
dst = "~/.codeium/windsurf/scripts/session_end.sh"

[[settings]]
manifest = "hooks/devin.atomic-hooks.json"
